      keep pixel leaves implicit; construct O(kN) spatial or tree-sibling candidates; initialize a
      parent by positive-energy spatial moments; eliminate its additive RGB coefficient in closed
      form using analytic Gaussian-product inner products; rank by estimated distortion increase
