      ADR-0026's premise: interior_holes_regressed accounts for most discarded work, so bounding it
      with an explicit trade-off budget should convert vetoed blocks into terminal quality.
    failure_mode: >
      Substitution is complete. At budget2e3 the interior-hole veto is eliminated entirely (0 of 72
      rejected blocks cite it) and the number of rejected blocks is unchanged; the rejections migrate
      wholesale to the CVaR99 tail guard and the boundary pixel-error terms. The recoverable set was
