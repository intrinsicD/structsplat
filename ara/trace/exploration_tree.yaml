      0.93 GPU-days at flat 2k cost or 4.31 GPU-days with linear budget scaling.
      The run also showed aniso_flanking and density_random tied on PSNR at
      2k/kodim01 seed0 while floyd_steinberg led MS-SSIM among the five
      calibration arms; this is calibration evidence only, not the ABL-004
      conclusion.
