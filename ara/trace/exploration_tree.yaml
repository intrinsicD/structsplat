      citations or occurrences. On the masked arm the lever is the CVaR99 tail guard plus the boundary
      pixel-error terms, not interior coverage, which supports ADR-0026's own view that the budget is
      the cheap half and FIT-030's proposal-time feasibility with local repair is the real fix.
