  - id: N13
    type: experiment
    title: "CUDA renderer and expanded stage controls implementation"
    provenance: ai-executed
    timestamp: "2026-07-02T23:19"
    result: >
      Implemented optional `cuda`/`gsplat` renderer mode backed by the local
      GaussianImage++ gsplat API, with CPU/device/extension guardrails. Added
      `scale_cap` as a stage-search axis with `feature12` as the baseline,
      exposed quadtree strategies in influence defaults, and added
      `support_duplicate`, `residual_tensor_add`, and
      `prune_residual_tensor_add` refinement modes. Updated fit/pyramid render
      calls, CLI options, and regression tests. Full `pytest -q` passed 79
      tests in 4.48 s. A direct CUDA smoke call reached the guarded failure:
      local gsplat extension cannot load because `/home/alex/miniconda3/.../libstdc++.so.6`
      lacks `CXXABI_1.3.15` for the cached `gsplat_cuda.so`.
    evidence:
      - "src/structsplat/render.py"
      - "src/structsplat/fit.py"
      - "benchmarks/stage_search.py"
      - "pytest-2026-07-02-79"
    also_depends_on: [N10, N11, N12]
    status: resolved
  - id: N14
    type: experiment
    title: "CUDA renderer speed benchmark"
    provenance: ai-executed
    timestamp: "2026-07-02T23:27"
    result: >
      Ran a CUDA renderer speed test on an NVIDIA GeForce RTX 3050 using
      `LD_PRELOAD=/usr/lib/x86_64-linux-gnu/libstdc++.so.6` to work around the
      local gsplat extension CXXABI mismatch. Render+backward microbenchmark
      on COCO image 000000000009 showed 14.46x, 5.03x, and 12.75x speedups
      versus the additive PyTorch reference at budgets 512, 1024, and 2048.
      Four-image 80-iteration fit loop at max-side 160, budget 512 showed
      mean wall time 0.241 s for `cuda` versus 1.082 s additive and 1.262 s
      normalized, giving 4.49x and 5.23x speedups respectively. However,
      dense-overlap parity was poor: additive reference versus CUDA mean abs
      pixel difference was 0.62755 with max 5.20287, and mean PSNR dropped to
      20.8340 for CUDA versus 23.1776 additive and 24.0452 normalized.
    evidence:
      - "cuda-renderer-speed-2026-07-02"
    also_depends_on: [N13]
    status: resolved
  - id: N15
    type: experiment
    title: "Exact StructSplat CUDA renderer"
    provenance: ai-executed
    timestamp: "2026-07-02T23:39"
    result: >
      Implemented an owned PyTorch CUDA extension for StructSplat's exact
      clipped-support normalized and additive renderer equations. `renderer=cuda`
      now maps to exact normalized CUDA; `renderer=cuda_additive` maps to exact
      additive CUDA; `renderer=gsplat` remains the GaussianImage++ alpha/sum
      comparator. On the COCO image 000000000009 parity smoke at budget 512,
      normalized versus CUDA had mean abs diff 4.0e-8 and max diff 5.4e-7;
      additive versus CUDA additive had mean abs diff 1.2e-7 and max diff
      2.9e-6. Four-image 80-iteration fit loop at max-side 160, budget 512
      showed mean wall time 0.181 s for exact CUDA normalized versus 1.181 s
      for normalized reference, preserving mean PSNR/MS-SSIM (24.0456/0.94853
      versus 24.0461/0.94849). Exact CUDA additive ran in 0.177 s versus 0.795 s
      additive reference, preserving mean PSNR/MS-SSIM. Full CUDA-enabled pytest
      with the system libstdc++ preload passed 81 tests in 5.74 s; normal pytest
      without preload passed 79 and skipped the 2 CUDA-extension tests.
    evidence:
      - "cuda-exact-renderer-2026-07-02"
      - "pytest-2026-07-02-81-cuda"
    also_depends_on: [N13, N14]
    status: resolved
  - id: N16
    type: experiment
    title: "Exact CUDA expanded stage-search rerun"
    provenance: ai-executed
    timestamp: "2026-07-02T23:47"
    result: >
      Reran the bounded four-image COCO stage search with the exact CUDA
      renderers and expanded stage axes: max-side 160, budget 512, seed 0,
      80 iterations, 64 shuffled configs, `cuda`/`cuda_additive` renderer
      stages, feature/hard/no scale caps, quadtree strategies, and
      residual_tensor refinement modes. The best sampled config reached
      24.4656 dB mean PSNR and 0.95407 mean MS-SSIM with 0.248 s mean fit
      time: aniso_flanking, scharr/rgb tensor, structure density, WSE sampling,
      two-sided color, spacing scale, feature12 scale cap, no opacity,
      exact normalized CUDA, Charbonnier loss, Adam, no LR schedule,
      residual_tensor_add, single-level fit. Against the previous bounded
      normalized screen's best row, this is +0.1728 dB PSNR, +0.00115 MS-SSIM,
      and 7.9x faster by best-row mean fit time. Across all 256 sampled rows,
      mean fit time improved from 2.454 s to 0.240 s and mean total row time
      from 2.534 s to 0.369 s, while `cuda` rows averaged 21.5830 dB PSNR
      versus 17.3759 dB for `cuda_additive`.
    evidence:
      - "stage-search-exact-cuda-2026-07-02"
    also_depends_on: [N05, N10, N13, N15]
    status: resolved
  - id: N17
    type: experiment
    title: "Current matched policy multi-resolution matrix"
    provenance: ai-executed
    timestamp: "2026-07-03T00:24"
    result: >
      Added `benchmarks/cross_repo_matrix_compare.py` and ran a matched
      executable comparison against local repo-inspired GaussianImage,
      GaussianImage++, Image-GS, and Instant-GI quadtree policies. The run used
      four COCO train2014 images, marking 000000000025 and 000000000034 as
      difficult; max-side 160/240/320; iteration counts 80/200; area-scaled
      Gaussian caps 640/1440/2560; exact CUDA renderer; LPIPS; PSNR, SSIM,
      MS-SSIM, PSNR-AUC, MAE, edge-MAE, scale stats, and runtime. All 120 rows
      completed with no errors and six visual grids were written. Overall, the
      best-searched StructSplat current row reached 26.0318 dB mean PSNR
      versus the best local repo-inspired analogue, GaussianImage, at 24.5942
      dB (+1.4376), but trailed GaussianImage on mean MS-SSIM by 0.00155 and
      trailed Instant-GI quadtree on LPIPS by 0.0475. That row won PSNR in
      all 6 aggregate resolution/iteration settings and 23/24 per-image cells;
      GaussianImage won 4/6 aggregate MS-SSIM settings and Instant-GI quadtree
      won 5/6 aggregate LPIPS settings.
      Fit time is now comparable across methods (StructSplat 0.441 s mean vs
      GaussianImage 0.425 s), while StructSplat total time remains higher
      because of tensor/WSE initialization and residual growth overhead.
      This node is evidence for the matched analogue harness, not a native
      external-repository benchmark or a shipped-default claim.
    evidence:
      - "benchmarks/cross_repo_matrix_compare.py"
      - "cross-repo-matrix-current-2026-07-03"
    also_depends_on: [N01, N03, N15, N16]
    status: resolved
  - id: N18
    type: experiment
    title: "ABL-003 regression bisect"
    provenance: ai-executed
    timestamp: "2026-07-03T12:19+0200"
    result: >
      Added `benchmarks/regression_bisect.py`, downloaded the four COCO train2014
      images by public HTTP URL into ignored `results/`, and reran the historical
      StructSplat `aniso_flanking` arm at the PR #2 merge base plus commits
      `71fad3e`, `ef730a9`, and `a455e98` in detached worktrees. The four-image
      CPU rerun matches the recorded shift closely: mean PSNR was 24.8202 dB at
      `f49aa18`, 24.8202 at `71fad3e`, 24.0510 at `ef730a9` (-0.7692), and
      24.0510 at `a455e98` (+0.0000). Verdict: the observed N03->N04 drop is
      localized to `ef730a9` and is an intentional semantic re-baseline, primarily
      from the blue-noise spacing-scale correction from exclusion radius to cell-side
      spacing (`sqrt(pi)` larger), with renderer support clipping and other correctness
      fixes in the same commit. The `a455e98` two-sided color fix is not the cause for
      the historical default `color_mode=bilinear` StructSplat arm.
    evidence:
      - "abl003-regression-bisect-2026-07-03"
    also_depends_on: [N03, N04, N05]
    status: resolved
