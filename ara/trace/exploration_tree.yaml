    title: "ABL-004 exact-CUDA runtime calibration"
    provenance: ai-executed
    timestamp: "2026-07-04T11:10+0200"
    result: >
      Added `--renderer` to `benchmarks.ablation`, included renderer in
      ablation cell identity and summaries, and changed
      `scripts/run_abl004_full_ablation.sh` to default to `RENDERER=cuda`.
      With `LD_PRELOAD=/usr/lib/x86_64-linux-gnu/libstdc++.so.6`, ran five
      full-iteration calibration cells on `kodim01`, max-side 768, budget
      2000, seed 0, 1500 iterations, exact CUDA: random, aniso_flanking,
      floyd_steinberg, density_random, and random_relocate. Mean fit time was
