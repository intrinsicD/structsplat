tree:
  - id: N01
    type: question
    title: "Compare StructSplat fairly"
    provenance: user
    timestamp: "2026-07-02T20:50"
    description: >
      Compare the current StructSplat approach against local GaussianImage,
      GaussianImage_plus, image-gs, and Instant-GI repositories.
    status: resolved
  - id: N02
    type: experiment
    title: "StructSplat local tests"
    provenance: ai-executed
    timestamp: "2026-07-02T20:50"
    result: >
      `python -m pytest -q` passed 33 tests in 108.55 seconds in
      `/home/alex/Documents/structsplat`.
    evidence:
      - "pytest-2026-07-02"
    status: resolved
  - id: N03
    type: experiment
    title: "COCO matched fit comparison"
    provenance: ai-executed
    timestamp: "2026-07-02T21:01"
    result: >
      Ran a matched reference comparison on four COCO train2014 images at max-side 160,
      512 Gaussian cap, and 80 iterations. StructSplat had the highest mean PSNR
      in this reference run: 24.833 dB vs GaussianImage 21.990, GaussianImage++
      20.191, Image-GS 20.996, and Instant-GI quadtree 18.350. Native repo
      CUDA/checkpoint runs remained blocked, so the result isolates
      initialization/growth policy under one renderer and fitter. Later bisect N18
      found this pre-`ef730a9` number is not directly comparable with post-`ef730a9`
      baselines because that commit intentionally changed blue-noise spacing-scale semantics.
    evidence:
      - "coco-fit-compare-2026-07-02"
    status: resolved
  - id: N04
    type: experiment
    title: "COCO matched fit comparison rerun after update"
    provenance: ai-executed
    timestamp: "2026-07-02T21:07"
    result: >
      Preserved the prior comparison grid and metrics under before_update filenames, then
      reran the same four-image COCO train2014 matched reference comparison at max-side
      160, 512 Gaussian cap, seed 0, and 80 iterations. New mean PSNR: StructSplat
      24.039 dB, GaussianImage 21.991, GaussianImage++ 20.191, Image-GS 20.542,
      and Instant-GI quadtree 18.362. Relative to the prior run, StructSplat changed
      by -0.794 dB and Image-GS by -0.455 dB, while random baselines were effectively
      unchanged. Later bisect N18 localized the StructSplat shift to `ef730a9`, not
      the subsequent `two_sided` color fix, and treats this as an intentional semantic
      re-baseline rather than an unresolved regression.
    evidence:
      - "coco-fit-compare-rerun-2026-07-02"
    status: resolved
  - id: N05
    type: experiment
    title: "COCO four-image stage-search screening"
    provenance: ai-executed
    timestamp: "2026-07-02T21:24"
    result: >
      Started the unmodified `scripts/run_stage_search_screening.sh` on the four selected
      COCO images, then interrupted it after 10 completed fits because its default
      1024/2048-budget, 300-iteration, 256-config schedule projected to a multi-hour run.
      Completed a bounded stage-search screening over the same sampled stage axes at
      max-side 160, budget 512, seed 0, 80 iterations, and 64 shuffled configs, producing
      256 rows across four images. Best sampled aggregate config reached 24.293 dB mean
      PSNR and 0.95292 mean MS-SSIM: aniso_flanking, central/luma tensor, variance
      density, WSE sampling, bilinear color, spacing scale, constant opacity,
      Charbonnier loss, Adam, no LR schedule, no refinement, single-level fit.
    evidence:
      - "stage-search-coco4-after-update-2026-07-02"
    status: resolved
  - id: N06
    type: experiment
    title: "Stage-search best visual comparison"
    provenance: ai-executed
    timestamp: "2026-07-02T21:29"
    result: >
      Rendered the best sampled stage-search configuration on the same four selected
      COCO images and compared it visually and numerically against the previous
      StructSplat row from the after-update comparison. Mean PSNR improved from
      24.0391 dB to 24.2925 dB (+0.2534). Per-image deltas were -0.0943,
      +0.3111, +0.0587, and +0.7381 dB for images 000000000009, 000000000025,
      000000000030, and 000000000034 respectively. Runtime analysis added at
      2026-07-02T21:35 found fit-only runtime changed from 2.0443 s to 1.9626 s
      (-3.99%), while total runtime changed to 2.0563 s (+0.59%).
    evidence:
      - "stage-search-best-visual-compare-2026-07-02"
    status: resolved
  - id: N07
    type: experiment
    title: "Optimization follow-up on held-out COCO images"
    provenance: ai-executed
    timestamp: "2026-07-02T21:53"
    result: >
      Implemented opt-in early stopping and a follow-up benchmark, then ran it on
      eight held-out COCO train2014 images at max-side 160, budget 512, seed 0,
      80 iterations, and render chunk 512. Stage-search top1 generalized best
      among same-budget candidates at 24.5490 dB mean PSNR, versus 24.3392 dB
      for the current baseline, but took 2.298 s total versus 2.104 s. WSE
      oversample 4 gave the best PSNR at 24.5665 dB, while oversample 3 was the
      better speed/quality tradeoff at 24.5395 dB and 2.285 s total. Conservative
      early stopping did not trigger in any run. Current residual-add refinement
      did not improve mean PSNR, and current pyramid variants fell to about
      22.91 dB while running slower. The exact Python tile-local render prototype
      matched the reference forward pass within about 6e-7 max absolute error but
      was roughly 10-12x slower on the measured 160px/512G cases.
    evidence:
      - "optimization-followup-2026-07-02"
    status: resolved
  - id: N08
    type: experiment
    title: "Quadtree aggregate initialization comparison"
    provenance: ai-executed
    timestamp: "2026-07-02T22:11"
    result: >
      Implemented a `quadtree_aggregate` initializer that recursively splits
      density-mass cells and assigns Gaussians from per-cell aggregate color,
      weighted centroid, tensor orientation, and coherence. Ran a focused
      comparison on the same eight held-out COCO train2014 images at max-side
      160, budget 512, seed 0, 80 iterations, and render chunk 512. Quadtree
      variants improved initial PSNR over stage_top1: aggregate-variance
      18.4563 dB, aggregate-structure 18.4912 dB, and bilinear-variance
      18.3986 dB versus stage_top1 18.1357 dB. After fitting, stage_top1
      remained best at 24.5490 dB mean PSNR; quadtree_bilinear_variance reached
      24.3506, quadtree_agg_variance 24.3340, quadtree_agg_structure 24.2493,
      and current_baseline 24.3390. Full pytest passed 71 tests in 4.31 s.
    evidence:
      - "quadtree-init-compare-2026-07-02"
    status: resolved
  - id: N09
    type: experiment
    title: "Hybrid and quadtree-allocated WSE initialization"
    provenance: ai-executed
    timestamp: "2026-07-02T22:21"
    result: >
      Implemented `quadtree_hybrid` and `quadtree_wse` initialization variants,
      then reran the eight-image held-out COCO comparison at max-side 160,
      budget 512, seed 0, 80 iterations, and render chunk 512. `quadtree_wse`
      reached 24.4847 dB mean PSNR, winning 3 of 8 images versus stage_top1 but
      trailing stage_top1 by 0.0644 dB on average. `quadtree_hybrid` with
      aggregate smooth cells reached 24.4838 dB and won 2 of 8 images, trailing
      stage_top1 by 0.0653 dB. `quadtree_hybrid` with bilinear colors reached
      24.4798 dB and won 1 of 8 images. All hybrid/quadtree-WSE variants were
      substantially closer to stage_top1 than the naive aggregate-only quadtree
      variants, but none beat stage_top1's 24.5491 dB mean PSNR. Full pytest
      passed 75 tests in 4.13 s.
    evidence:
      - "quadtree-hybrid-wse-compare-2026-07-02"
    status: resolved
  - id: N10
    type: experiment
    title: "Feature-adaptive scale caps for spike suppression"
    provenance: ai-executed
    timestamp: "2026-07-02T22:44"
    result: >
      Implemented per-Gaussian scale caps carried by `GaussianField`, enforced
      during optimization, with hard caps and a feature-adaptive cap that walks
      along the structure-tensor tangent until edge energy drops or a corner is
      hit. Reran the eight-image COCO quadtree comparison at max-side 160,
      budget 512, seed 0, 80 iterations, and render chunk 512. Uncapped
      stage_top1 had 24.5490 dB mean PSNR, 72.740 mean final max scale, 25.818
      mean final p95 scale, and 2.293 s total runtime. `stage_top1_feature_cap12`
      reached 24.6423 dB, capped final max/p95 scale to 12.0, won 7 of 8
      images, and cut total runtime to 1.269 s. `quadtree_wse_feature_cap12`
      reached the best mean PSNR at 24.6528 dB, capped final max/p95 scale to
      12.0, won 7 of 8 images versus stage_top1, and ran in 1.360 s. Hard cap
      8 reduced scale and runtime further but lowered mean PSNR versus
      stage_top1. Full pytest passed 77 tests in 4.22 s.
    evidence:
      - "feature-scale-cap-compare-2026-07-02"
    status: resolved
  - id: N11
